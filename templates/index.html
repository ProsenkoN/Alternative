<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <title>ZAPISKI</title>
</head>

<body>
    <h1>ZAPISKI</h1>
    <h2>Moji zapiski</h2>
    <ul>
        {% for ime, vsebina in notes.items() %}
            <li>{{ vsebina }}</li>
        {% else %}
            <li>Ni zapiskov.</li>
        {% endfor %}
    </ul>
    <form action="/dodajZapisek" method="post">
        <textarea id="moji_zapiski" name="note"></textarea>
        <button type="submit">DODAJ ZAPISKE</button>
    </form>

</body>
<script>
    $.ajax({
        url: "/api/getWeather",
        data: {
            zipcode: 97201
       },
       success: function (result) {
           $("#weather-temp").html("<strong>" + result + "</strong> degrees");
       }
   });
</script>

</html>
